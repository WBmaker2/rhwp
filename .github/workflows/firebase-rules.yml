name: Firebase rules

on:
  pull_request:
    branches: [devel]
    paths:
      - 'firebase/**'
      - '.github/workflows/firebase-rules.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: firebase
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test Firestore and Storage rules
        working-directory: firebase
        run: |
          npm run test:rules > rules-test.log 2>&1 || {
            cat rules-test.log
            exit 1
          }
      - name: Upload rules diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firebase-rules-${{ github.run_id }}
          path: firebase/rules-test.log
          retention-days: 1
          if-no-files-found: error
