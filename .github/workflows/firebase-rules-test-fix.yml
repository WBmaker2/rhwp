name: Firebase rules test fix

on:
  pull_request:
    branches: [devel]
    paths:
      - '.github/workflows/firebase-rules-test-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Normalize downloaded bytes and isolate storage tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('firebase/tests/rules.test.mjs')
          text = path.read_text()
          text = text.replace(
              "beforeEach(async () => {\n  await testEnv.clearFirestore()\n})",
              "beforeEach(async () => {\n  await Promise.all([testEnv.clearFirestore(), testEnv.clearStorage()])\n})",
          )
          text = text.replace(
              "assert.deepEqual(bytes, Uint8Array.of(1, 2, 3))",
              "assert.deepEqual(new Uint8Array(bytes), Uint8Array.of(1, 2, 3))",
          )
          path.write_text(text)
          PY
      - name: Commit test correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add firebase/tests/rules.test.mjs
          git commit -m "test: normalize Firebase storage emulator bytes"
          git push origin HEAD:${{ github.head_ref }}
