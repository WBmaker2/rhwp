name: Collaboration rustfmt diagnostic

on:
  pull_request:
    branches: [devel]
    paths:
      - 'src/collaboration/**'
      - 'tests/collaboration_model.rs'
      - '.github/workflows/collaboration-rustfmt-diagnostic.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format collaboration implementation
        run: cargo fmt --all
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- \
            src/collaboration/apply.rs \
            src/collaboration/import.rs \
            src/collaboration/mod.rs \
            tests/collaboration_model.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/collaboration/apply.rs \
            src/collaboration/import.rs \
            src/collaboration/mod.rs \
            tests/collaboration_model.rs
          git commit -m 'style: format collaboration image implementation'
          git push origin HEAD:${{ github.head_ref }}
