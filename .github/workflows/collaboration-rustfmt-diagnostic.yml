name: Collaboration rustfmt diagnostic

on:
  pull_request:
    branches: [devel]
    paths:
      - 'src/collaboration/**'
      - 'tests/collaboration_model.rs'
      - '.github/workflows/collaboration-rustfmt-diagnostic.yml'

permissions:
  contents: read

jobs:
  rustfmt-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt
      - name: Generate rustfmt patch
        run: |
          cargo fmt --all
          git diff -- src/collaboration tests/collaboration_model.rs > rustfmt.patch
          cat rustfmt.patch
      - name: Upload rustfmt patch
        uses: actions/upload-artifact@v7
        with:
          name: collaboration-rustfmt-patch-${{ github.run_id }}
          path: rustfmt.patch
          retention-days: 1
          if-no-files-found: error
