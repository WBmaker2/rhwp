name: HWPX roundtrip diagnostic

on:
  pull_request:
    branches: [devel]
    paths:
      - 'tests/collaboration_model.rs'
      - 'src/collaboration/**'
      - '.github/workflows/hwpx-roundtrip-diagnostic.yml'

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run HWPX roundtrip test
        run: |
          set -o pipefail
          cargo test --test collaboration_model collaboration_patch_survives_hwpx_roundtrip -- --nocapture 2>&1 | tee hwpx-roundtrip.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hwpx-roundtrip-${{ github.run_id }}
          path: hwpx-roundtrip.log
          retention-days: 1
          if-no-files-found: error
