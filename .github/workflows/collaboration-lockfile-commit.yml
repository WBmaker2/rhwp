name: Generate collaboration server lockfile once

on:
  push:
    branches:
      - feat/firebase-collaboration-mvp-v1
    paths:
      - '.github/workflows/collaboration-lockfile-commit.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/firebase-collaboration-mvp-v1
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate lockfile
        working-directory: services/collaboration-server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/collaboration-server/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: lock collaboration server dependencies'
          git push origin HEAD:feat/firebase-collaboration-mvp-v1
