name: Document worker lockfile sync

on:
  pull_request:
    branches: [devel]
    paths:
      - 'services/document-worker/package.json'
      - 'services/document-worker/package-lock.json'
      - '.github/workflows/document-worker-lockfile-sync.yml'

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate document worker lockfile
        working-directory: services/document-worker
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify deterministic install
        working-directory: services/document-worker
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test document worker
        working-directory: services/document-worker
        run: npm test

      - name: Build document worker
        working-directory: services/document-worker
        run: npm run build

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- services/document-worker/package-lock.json; then
            echo 'services/document-worker/package-lock.json is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/document-worker/package-lock.json
          git commit -m 'chore(document-worker): add npm lockfile'
          git push origin "HEAD:${{ github.head_ref }}"
