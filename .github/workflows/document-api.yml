name: Document API

on:
  pull_request:
    branches: [devel]
    paths:
      - 'services/document-api/**'
      - '.github/workflows/document-api.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: services/document-api
        run: npm install --ignore-scripts
      - name: Test
        working-directory: services/document-api
        run: npm test
      - name: Build
        working-directory: services/document-api
        run: |
          npm run build > build.log 2>&1 || {
            cat build.log
            exit 1
          }
      - name: Upload build diagnostics and lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: document-api-build-${{ github.run_id }}
          path: |
            services/document-api/build.log
            services/document-api/package-lock.json
          retention-days: 1
          if-no-files-found: error
