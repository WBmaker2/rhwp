name: Document API

on:
  pull_request:
    branches: [devel]
    paths:
      - 'services/document-api/**'
      - '.github/workflows/document-api.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/document-api/package-lock.json
      - name: Install dependencies
        working-directory: services/document-api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and build
        working-directory: services/document-api
        run: |
          set -o pipefail
          npm test 2>&1 | tee document-api.log
          npm run build 2>&1 | tee -a document-api.log
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: document-api-${{ github.run_id }}
          path: services/document-api/document-api.log
          retention-days: 1
          if-no-files-found: error
