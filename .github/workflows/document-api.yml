name: Document API

on:
  pull_request:
    branches: [devel]
    paths:
      - 'services/document-api/**'
      - '.github/workflows/document-api.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: services/document-api
        run: npm install --ignore-scripts
      - name: Test
        working-directory: services/document-api
        run: npm test
      - name: Build
        working-directory: services/document-api
        run: npm run build
      - name: Commit generated lockfile
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/document-api/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock document API dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi
