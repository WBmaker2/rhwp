name: Document API

on:
  pull_request:
    branches: [devel]
    paths:
      - 'services/document-api/**'
      - '.github/workflows/document-api.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/document-api/package-lock.json
      - name: Install dependencies
        working-directory: services/document-api
        run: npm ci --ignore-scripts
      - name: Test
        working-directory: services/document-api
        run: npm test
      - name: Build
        working-directory: services/document-api
        run: npm run build
