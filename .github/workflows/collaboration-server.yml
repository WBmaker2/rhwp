name: Collaboration server

on:
  pull_request:
    branches: [devel]
    paths:
      - 'services/collaboration-server/**'
      - '.github/workflows/collaboration-server.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/collaboration-server
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/collaboration-server/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck
        run: |
          set -o pipefail
          npm run build 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: collaboration-server-typecheck-${{ github.run_id }}
          path: services/collaboration-server/typecheck.log
          retention-days: 1
          if-no-files-found: error
