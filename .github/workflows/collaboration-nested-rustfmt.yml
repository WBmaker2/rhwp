name: Collaboration nested rustfmt

on:
  pull_request:
    branches: [devel]
    paths:
      - 'tests/collaboration_nested_objects.rs'
      - '.github/workflows/collaboration-nested-rustfmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format focused test
        run: rustfmt --edition 2021 tests/collaboration_nested_objects.rs
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/collaboration_nested_objects.rs
          if ! git diff --cached --quiet; then
            git commit -m "style: format nested collaboration test"
            git push origin HEAD:${{ github.head_ref }}
          fi
