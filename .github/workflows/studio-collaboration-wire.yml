name: Studio collaboration wire

on:
  pull_request:
    branches: [devel]
    paths:
      - '.github/workflows/studio-collaboration-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Expose runtime and cursor snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path

          input_path = Path('rhwp-studio/src/engine/input-handler.ts')
          text = input_path.read_text()
          anchor = '  /** 클릭 이벤트 처리 — hitTest로 커서 배치 */\n'
          method = (
              '  /** 공동 편집 Awareness에 노출할 현재 커서와 선택의 불변 스냅샷. */\n'
              '  getCollaborationSelectionSnapshot(): {\n'
              '    position: DocumentPosition;\n'
              '    selection: { anchor: DocumentPosition; focus: DocumentPosition } | null;\n'
              '  } {\n'
              '    return {\n'
              '      position: this.cursor.getPosition(),\n'
              '      selection: this.cursor.getSelection(),\n'
              '    };\n'
              '  }\n\n'
          )
          if 'getCollaborationSelectionSnapshot' not in text:
              if anchor not in text:
                  raise SystemExit('input-handler collaboration anchor not found')
              text = text.replace(anchor, method + anchor, 1)
          input_path.write_text(text)

          main_path = Path('rhwp-studio/src/main.ts')
          text = main_path.read_text()
          anchor = (
              '    inputHandler.setPictureObjectRenderer(\n'
              '      new TableObjectRenderer(container, canvasView.getVirtualScroll(), true),\n'
              '    );\n'
          )
          addition = anchor + (
              '\n'
              '    (window as any).__rhwpStudioRuntime = {\n'
              '      wasm,\n'
              '      eventBus,\n'
              '      inputHandler,\n'
              "      scrollContent: document.getElementById('scroll-content')!,\n"
              '      virtualScroll: canvasView.getVirtualScroll(),\n'
              '      viewportManager: canvasView.getViewportManager(),\n'
              '    };\n'
          )
          if '__rhwpStudioRuntime' not in text:
              if anchor not in text:
                  raise SystemExit('main collaboration runtime anchor not found')
              text = text.replace(anchor, addition, 1)
          main_path.write_text(text)

          index_path = Path('rhwp-studio/index.html')
          text = index_path.read_text()
          anchor = '  <script type="module" src="/src/main.ts"></script>\n'
          addition = anchor + '  <script type="module" src="/src/collaboration-entry.ts"></script>\n'
          if 'collaboration-entry.ts' not in text:
              if anchor not in text:
                  raise SystemExit('index collaboration entry anchor not found')
              text = text.replace(anchor, addition, 1)
          index_path.write_text(text)
          PY
      - name: Update lockfile and verify studio collaboration
        working-directory: rhwp-studio
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:collaboration
          npm run build
      - name: Commit runtime wiring and remove one-shot workflows
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rhwp-studio/package-lock.json rhwp-studio/src/engine/input-handler.ts rhwp-studio/src/main.ts rhwp-studio/index.html
          git rm .github/workflows/studio-collaboration-wire.yml .github/workflows/studio-collaboration-lock.yml
          git commit -m "feat: wire collaboration into rhwp studio runtime"
          git push origin HEAD:${{ github.head_ref }}
