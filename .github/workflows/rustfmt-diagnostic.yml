name: Rustfmt diagnostic

on:
  pull_request:
    branches: [devel]
    paths:
      - 'tests/collaboration_model.rs'
      - '.github/workflows/rustfmt-diagnostic.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format collaboration test
        run: cargo fmt --all
      - name: Upload formatted test
        uses: actions/upload-artifact@v7
        with:
          name: formatted-collaboration-test-${{ github.run_id }}
          path: tests/collaboration_model.rs
          retention-days: 1
          if-no-files-found: error
