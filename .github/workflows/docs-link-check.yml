name: Documentation Link Check

on:
  push:
    branches: [main, devel]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'mydocs/**'
      - 'scripts/check_markdown_links.py'
      - '.github/workflows/docs-link-check.yml'
  pull_request:
    branches: [main, devel]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'mydocs/**'
      - 'scripts/check_markdown_links.py'
      - '.github/workflows/docs-link-check.yml'
  workflow_dispatch:

jobs:
  check-markdown-links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check internal Markdown links
        run: |
          python3 scripts/check_markdown_links.py
          python3 scripts/check_markdown_links.py \
            --forbid-path mydocs/manual/visual_verification_governance.md \
            --forbid-path mydocs/manual/visual_sweep_guide.md \
            --forbid-path mydocs/manual/object_visual_regression.md \
            --forbid-path mydocs/manual/roundtrip_fidelity_harness.md \
            --forbid-path mydocs/manual/svg_regression_diff.md \
            --forbid-path mydocs/manual/visual_clipping_detector.md \
            --forbid-path mydocs/manual/hangul_pdf_baseline.md \
            --forbid-path mydocs/manual/hangul_page_oracle.md \
            --forbid-path mydocs/manual/verify_pi_page_vs_hangul.md
