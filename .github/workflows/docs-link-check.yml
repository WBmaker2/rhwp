name: Documentation Link Check

on:
  push:
    branches: [main, devel]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'mydocs/**'
      - 'scripts/check_markdown_links.py'
      - 'scripts/check_document_metadata.py'
      - '.github/workflows/docs-link-check.yml'
  pull_request:
    branches: [main, devel]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'mydocs/**'
      - 'scripts/check_markdown_links.py'
      - 'scripts/check_document_metadata.py'
      - '.github/workflows/docs-link-check.yml'
  workflow_dispatch:

jobs:
  check-markdown-links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check internal Markdown links
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--forbid-redirect-references)
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            args+=(--changed-from "$BASE_SHA")
          fi
          python3 scripts/check_markdown_links.py "${args[@]}"
          python3 scripts/check_document_metadata.py
