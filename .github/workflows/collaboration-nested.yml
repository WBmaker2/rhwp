name: Nested collaboration objects

on:
  pull_request:
    branches: [devel]
    paths:
      - 'src/collaboration/**'
      - 'tests/collaboration_nested_objects.rs'
      - '.github/workflows/collaboration-nested.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          show-progress: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test nested readonly object preservation
        run: cargo test --test collaboration_nested_objects -- --nocapture
