apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rhwp-collaboration-staging
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: ${COLLABORATION_SERVICE_ACCOUNT}
      containerConcurrency: 80
      timeoutSeconds: 3600
      containers:
        - image: ${COLLABORATION_IMAGE}@sha256:${COLLABORATION_IMAGE_DIGEST}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: FIREBASE_STORAGE_BUCKET
              value: ${FIREBASE_STORAGE_BUCKET}
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rhwp-collaboration-internal-token-staging
                  key: latest
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
