apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rhwp-document-worker-staging
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: ${DOCUMENT_WORKER_SERVICE_ACCOUNT}
      containerConcurrency: 1
      timeoutSeconds: 900
      containers:
        - image: ${DOCUMENT_WORKER_IMAGE}@sha256:${DOCUMENT_WORKER_IMAGE_DIGEST}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: FIREBASE_STORAGE_BUCKET
              value: ${FIREBASE_STORAGE_BUCKET}
            - name: RHWP_COLLABORATION_WORKER_BIN
              value: /usr/local/bin/rhwp-collaboration-worker
            - name: ALLOW_EMULATOR_TASKS
              value: "false"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
